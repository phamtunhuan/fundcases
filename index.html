<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私募处罚案例库</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="seal">罚</span><div><h1>私募处罚案例库</h1><p>证监会、证监局、中基协、中证协、交易所处罚与监管措施汇编</p></div></div>
  <input id="q" type="search" placeholder="搜索机构、文号、案由、法条，多个词用空格分隔" aria-label="搜索">
</header>
<main class="wrap">
  <aside class="filters" aria-label="筛选">
    <div class="group"><h2>处罚机关</h2><div id="groups" class="chips"></div></div>
    <label>年份<select id="y"></select></label>
    <label>措施类型<select id="m"></select></label>
    <label>当事人类型<select id="r"></select></label>
    <label>违规类型<select id="v"></select></label>
    <label>排序<select id="sort">
      <option value="date-desc">日期：新到旧</option><option value="date-asc">日期：旧到新</option>
      <option value="fine-desc">罚款：高到低</option></select></label>
    <button id="reset" type="button">清除筛选</button>
  </aside>
  <section>
    <p id="stat" class="stat" aria-live="polite"></p>
    <div id="list"></div>
    <button id="more" type="button" hidden>显示更多</button>
  </section>
</main>
<footer>数据整理自公开信息，摘要为人工归纳，仅供研究参考，以官方原文为准。</footer>
<dialog id="dlg"><article id="detail"></article></dialog>
<script src="assets/app.js"></script>
</body>
</html>
